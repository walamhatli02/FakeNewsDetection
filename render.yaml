# render.yaml – Render.com deployment config (Week 7)
# Deploy: https://render.com → "New" → "Blueprint" → connect your GitHub repo

services:
  # ── FastAPI Backend ───────────────────────────────────────────
  - type: web
    name: fake-news-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATA_DIR
        value: data
      - key: PYTHON_VERSION
        value: "3.10.0"
    disk:
      name: model-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  # ── MLflow Tracking Server ────────────────────────────────────
  - type: web
    name: fake-news-mlflow
    runtime: python
    buildCommand: "pip install mlflow"
    startCommand: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root ./mlruns
      --host 0.0.0.0
      --port $PORT
