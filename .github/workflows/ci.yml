name: CI – Fake News Detection

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ──────────────────────────────────────
  # 1. Unit & Integration Tests
  # ──────────────────────────────────────
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  # ──────────────────────────────────────
  # 2. Train model on synthetic data
  # ──────────────────────────────────────
  train:
    name: Training Pipeline
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic data
        run: python src/generate_sample_data.py

      - name: Train model
        run: python -m src.train --data_dir data/ --output_dir data/ --mlflow_uri sqlite:///mlflow.db

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            data/best_model.pkl
            data/tfidf_vectorizer.pkl
            data/feature_cols.json
            data/training_meta.json

  # ──────────────────────────────────────
  # 3. Docker build check
  # ──────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: train

    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: data/

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t fake-news-api:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t fake-news-frontend:ci ./frontend

      - name: Test API container starts
        run: |
          docker run -d --name test-api -p 8000:8000 \
            -v $(pwd)/data:/app/data fake-news-api:ci
          sleep 10
          curl -f http://localhost:8000/health || (docker logs test-api && exit 1)
          docker stop test-api
